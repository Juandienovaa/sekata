<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-[#fff9f2] p-4">
  <!-- Test Option A: Side-by-side (2 columns on mobile) -->
  <div class="w-full max-w-[375px] mx-auto bg-[#fff5e3] p-3 rounded-2xl border border-espresso/20 mb-6">
    <div class="flex flex-row items-center gap-3">
      <!-- Photo Left -->
      <div class="w-[42%] shrink-0">
        <div class="relative">
          <div class="absolute inset-0 bg-[#f5ba31] rounded-2xl transform rotate-2 translate-x-1 translate-y-1"></div>
          <div class="relative aspect-[4/5] rounded-2xl overflow-hidden border border-black/20 shadow-md">
            <img src="/CTA.jpg" class="w-full h-full object-cover">
            <div class="absolute top-1.5 left-1.5 bg-[#f5ba31] text-[8px] font-mono font-bold px-1.5 py-0.5 rounded-full">
              5 SIPS
            </div>
          </div>
        </div>
      </div>
      <!-- Text Right -->
      <div class="flex-1 min-w-0">
        <div class="inline-block bg-black text-[#f5ba31] text-[8.5px] font-mono px-2 py-0.5 rounded-full font-bold uppercase mb-1">
          #GRABYOURSEKATA
        </div>
        <h2 class="text-sm font-black text-[#522c25] uppercase leading-tight tracking-tight mb-1">
          GOOD COFFEE,<br/>HONEST TALKS.<br/>
          <span class="text-[#317576]">GRAB YOUR SEKATA.</span>
        </h2>
        <p class="text-[10px] text-[#522c25]/80 leading-snug mb-2 line-clamp-2">
          Manual brew, espresso & chilled drinks di slowbar Tanjungpinang.
        </p>
        <a href="#" class="inline-flex items-center justify-center gap-1 w-full py-1.5 px-2 bg-[#317576] text-white text-[10px] font-bold rounded-full uppercase">
          GRAB VIA WHATSAPP &nearr;
        </a>
      </div>
    </div>
  </div>
</body>
</html>
